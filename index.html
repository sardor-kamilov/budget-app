<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --ok: #30a46c;
    --warn: #f5a524;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 12px 16px 96px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--bg); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .muted { color: var(--hint); font-size: 13px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--hint); margin: 18px 4px 8px; }
  .hero .label { font-size: 13px; color: var(--hint); }
  .hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 2px; font-variant-numeric: tabular-nums; }
  .hero .big.neg { color: var(--danger); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--bg2); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat span { font-size: 11px; color: var(--hint); }
  .bar { height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .4s; }
  .bar > i.warn { background: var(--warn); }
  .bar > i.over { background: var(--danger); }
  .hero .bar { height: 8px; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .lim { padding: 10px 0; border-bottom: 1px solid var(--bg2); }
  .lim:last-child { border-bottom: 0; padding-bottom: 0; }
  .lim:first-child { padding-top: 0; }
  .lim .name { font-weight: 500; }
  .lim .val { font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lim .val.over { color: var(--danger); font-weight: 600; }
  .op { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bg2); }
  .op:last-child { border-bottom: 0; }
  .op .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--bg2); display: grid; place-items: center; font-size: 17px; flex: none; }
  .op .mid { flex: 1; min-width: 0; }
  .op .mid div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op .sum { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .op .sum.inc { color: var(--ok); }
  .op button { border: 0; background: none; color: var(--hint); font-size: 18px; padding: 4px 6px; cursor: pointer; }
  .empty { text-align: center; color: var(--hint); padding: 12px 0; }
  .msg { text-align: center; padding: 48px 16px; color: var(--hint); }
  .skeleton { background: var(--bg2); border-radius: 8px; height: 14px; margin: 8px 0; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* Лист добавления */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 18px 18px 0 0;
    padding: 18px 16px 24px; transform: translateY(105%); transition: transform .25s ease, visibility .25s; max-height: 88vh; overflow-y: auto; visibility: hidden; }
  .open .sheet-bg { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; visibility: visible; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg2); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: none; color: var(--text); padding: 8px; border-radius: 8px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--bg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .amount { width: 100%; border: 0; outline: 0; background: none; color: var(--text); font-size: 38px; font-weight: 700;
    text-align: center; padding: 18px 0 4px; font-variant-numeric: tabular-nums; }
  .amount::placeholder { color: var(--hint); opacity: .5; }
  .cur { text-align: center; color: var(--hint); font-size: 13px; margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--bg2); background: var(--bg2); color: var(--text); padding: 8px 12px; border-radius: 20px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .comment { width: 100%; margin-top: 14px; border: 0; outline: 0; background: var(--bg2); color: var(--text); border-radius: 10px; padding: 12px; font: inherit; }
  .fallback-btn { display: none; width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 14px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  .no-tg .fallback-btn { display: block; }
  .fab { display: none; position: fixed; right: 16px; bottom: 20px; border: 0; border-radius: 28px; padding: 14px 22px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .no-tg .fab { display: block; }
</style>
</head>
<body>
<main id="app">
  <div class="card"><div class="skeleton" style="width:40%"></div><div class="skeleton" style="height:32px;width:70%"></div><div class="skeleton"></div></div>
  <div class="card"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
</main>
<button class="fab" id="fab">+ Добавить</button>

<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-label="Новая запись">
    <div class="seg" id="seg">
      <button data-t="Расход" class="on">Расход</button>
      <button data-t="Копилка">Копилка</button>
      <button data-t="Доход">Доход</button>
    </div>
    <input id="amount" class="amount" inputmode="numeric" placeholder="0" autocomplete="off">
    <div class="cur">сум</div>
    <div class="chips" id="chips"></div>
    <input id="comment" class="comment" placeholder="Комментарий (необязательно)" maxlength="200">
    <button class="fallback-btn" id="saveBtn">Сохранить</button>
  </div>
</div>

<script>
// ===== АДРЕС API (веб-приложение Apps Script) =====
const API_URL = 'https://script.google.com/macros/s/AKfycbydwUwPCYNLk7Cj6UQeUnX8bEObUnXOkm0LxE3YlAUDCIx4lDa1RyYDY2tTcLR_G9WkiQ/exec';

const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const ICONS = { 'Продукты':'🛒','Сад':'🧸','Кредит':'🏦','Топливо':'🔌','Коммуналка':'💡','Жене':'💐','Ребёнок':'🍼',
  'Ужин/кафе':'🍽','Сигареты':'🚬','Подписки':'📺','Транспорт':'🚗','Связь':'📱','Питьевая вода':'💧','Копилка':'🎯',
  'Доход':'💰','Долги':'💳','Подарки':'🎁','Барбершоп':'💈','Лекарства':'💊','Другое':'📦' };
const app = document.getElementById('app');
let data = null, busy = false;
const form = { type: 'Расход', category: null };

const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const short = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.', ',') + ' млн' : fmt(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const haptic = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };

async function call(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : '' }, payload)),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

function render() {
  const d = data;
  const left = d.income - d.spent - d.saved;
  const usedPct = d.income ? Math.min(100, (d.spent + d.saved) / d.income * 100) : 0;
  const cls = p => p >= 100 ? 'over' : p >= 80 ? 'warn' : '';

  const limits = d.limits.filter(l => l.limit || l.spent).sort((a, b) => {
    if (a.cat === 'Копилка') return -1;
    if (b.cat === 'Копилка') return 1;
    const pa = a.limit ? a.spent / a.limit : 2, pb = b.limit ? b.spent / b.limit : 2;
    return pb - pa;
  }).map(l => {
    const p = l.limit ? l.spent / l.limit * 100 : 100;
    if (l.cat === 'Копилка') {  // для копилки превышение — это хорошо
      return `<div class="lim">
        <div class="row"><span class="name">🎯 Копилка — цель</span>
        <span class="val">${short(l.spent)}${l.limit ? ' / ' + short(l.limit) : ''}${p >= 100 ? ' ✅' : ''}</span></div>
        <div class="bar"><i style="width:${Math.min(100, p)}%"></i></div></div>`;
    }
    const over = l.limit && l.spent > l.limit;
    return `<div class="lim">
      <div class="row"><span class="name">${ICONS[l.cat] || '•'} ${esc(l.cat)}</span>
      <span class="val ${over ? 'over' : ''}">${short(l.spent)}${l.limit ? ' / ' + short(l.limit) : ''}</span></div>
      <div class="bar"><i class="${cls(p)}" style="width:${Math.min(100, p)}%"></i></div></div>`;
  }).join('');

  const ops = d.recent.length ? d.recent.map(o => {
    const dt = new Date(o.ts);
    const when = dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' +
      dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const inc = o.type === 'Доход';
    return `<div class="op">
      <div class="ic">${ICONS[o.category] || '📦'}</div>
      <div class="mid"><div>${esc(o.category)}${o.comment ? ' · <span class="muted">' + esc(o.comment) + '</span>' : ''}</div>
      <div class="muted">${when}</div></div>
      <div class="sum ${inc ? 'inc' : ''}">${inc ? '+' : '−'}${fmt(o.amount)}</div>
      <button aria-label="Удалить" data-row="${o.row}" data-ts="${o.ts}">×</button></div>`;
  }).join('') : '<div class="empty">Пока пусто. Нажми «Добавить» внизу.</div>';

  app.innerHTML = `
    <div class="card hero">
      <div class="label">${d.income ? 'Осталось до зарплаты' : 'Потрачено в этом месяце'} · ${d.daysLeft} дн.</div>
      <div class="big ${left < 0 && d.income ? 'neg' : ''}">${fmt(d.income ? left : d.spent)} <span style="font-size:18px;font-weight:600">сум</span></div>
      <div class="muted">Месяц ${d.periodFrom} — ${d.periodTo}${d.income && left > 0 && d.daysLeft ? ' · ~' + short(left / d.daysLeft) + ' в день' : ''}</div>
      ${d.income ? `<div class="bar"><i class="${cls(usedPct)}" style="width:${usedPct}%"></i></div>` : ''}
      <div class="stats">
        <div class="stat"><span>Доход</span><b>${short(d.income)}</b></div>
        <div class="stat"><span>Расходы</span><b>${short(d.spent)}</b></div>
        <div class="stat"><span>🎯 Копилка</span><b>${short(d.saved)}</b></div>
      </div>
    </div>
    <h2>Лимиты</h2><div class="card">${limits || '<div class="empty">Нет данных</div>'}</div>
    <h2>Последние записи</h2><div class="card">${ops}</div>`;
}

function renderChips() {
  const chips = document.getElementById('chips');
  if (form.type !== 'Расход') { chips.innerHTML = ''; return; }
  const first = ['Продукты', 'Ужин/кафе', 'Топливо', 'Ребёнок', 'Сигареты', 'Транспорт'];
  const all = (data ? data.categories : []).filter(c => c !== 'Копилка');
  const cats = first.filter(c => all.includes(c)).concat(all.filter(c => !first.includes(c)));
  chips.innerHTML = cats.map(c =>
    `<button class="chip ${form.category === c ? 'on' : ''}" data-c="${esc(c)}">${ICONS[c] || ''} ${esc(c)}</button>`).join('');
}

function amountValue() { return Number(document.getElementById('amount').value.replace(/\D/g, '')) || 0; }

function updateMainButton() {
  if (!inTg) return;
  const open = document.getElementById('sheetWrap').classList.contains('open');
  if (!open) { tg.MainButton.setParams({ text: '＋ Добавить', is_active: true, is_visible: true }); return; }
  const ready = amountValue() > 0 && (form.type !== 'Расход' || form.category);
  tg.MainButton.setParams({ text: ready ? 'Сохранить ' + fmt(amountValue()) + ' сум' : 'Введи сумму и категорию', is_active: ready });
}

function openSheet() {
  document.getElementById('sheetWrap').classList.add('open');
  renderChips();
  setTimeout(() => document.getElementById('amount').focus(), 250);
  if (inTg) tg.BackButton.show();
  updateMainButton();
}
function closeSheet() {
  document.getElementById('sheetWrap').classList.remove('open');
  document.getElementById('amount').blur();
  if (inTg) tg.BackButton.hide();
  updateMainButton();
}
const isOpen = () => document.getElementById('sheetWrap').classList.contains('open');

async function save() {
  if (busy) return;
  const amount = amountValue();
  if (!amount || (form.type === 'Расход' && !form.category)) { haptic('error'); return; }
  busy = true;
  if (inTg) tg.MainButton.showProgress();
  try {
    const payload = form.type === 'Копилка'
      ? { api: 'add', type: 'Расход', category: 'Копилка', amount }
      : { api: 'add', type: form.type, category: form.category, amount };
    payload.comment = document.getElementById('comment').value.trim();
    data = await call(payload);
    haptic('success');
    document.getElementById('amount').value = '';
    document.getElementById('comment').value = '';
    form.category = null;
    render();
    closeSheet();
  } catch (e) {
    haptic('error');
    alertMsg('Не сохранилось: ' + e.message);
  } finally {
    busy = false;
    if (inTg) tg.MainButton.hideProgress();
  }
}

function alertMsg(t) { if (inTg && tg.showAlert) tg.showAlert(t); else alert(t); }

async function removeOp(row, ts) {
  const go = async () => {
    try { data = await call({ api: 'delete', row, ts }); haptic('success'); render(); }
    catch (e) { alertMsg(e.message === 'stale' ? 'Список устарел, обновляю' : 'Ошибка: ' + e.message); load(); }
  };
  if (inTg && tg.showConfirm) tg.showConfirm('Удалить запись?', ok => ok && go());
  else if (confirm('Удалить запись?')) go();
}

async function load() {
  try { data = await call({ api: 'summary' }); render(); renderChips(); }
  catch (e) {
    app.innerHTML = `<div class="msg">${e.message === 'auth'
      ? 'Доступ только для владельца.<br>Открой приложение из своего бота в Telegram.'
      : 'Не удалось загрузить данные.<br>Проверь интернет и открой ещё раз.'}</div>`;
  }
}

// ===== События =====
document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  form.type = b.dataset.t; form.category = null;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  renderChips(); updateMainButton();
});
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  form.category = b.dataset.c; renderChips(); updateMainButton();
  try { tg.HapticFeedback.selectionChanged(); } catch (err) {}
});
document.getElementById('amount').addEventListener('input', e => {
  const n = amountValue(); e.target.value = n ? fmt(n) : ''; updateMainButton();
});
document.getElementById('sheetBg').addEventListener('click', closeSheet);
document.getElementById('saveBtn').addEventListener('click', save);
document.getElementById('fab').addEventListener('click', openSheet);
app.addEventListener('click', e => {
  const b = e.target.closest('button[data-row]');
  if (b) removeOp(Number(b.dataset.row), Number(b.dataset.ts));
});

if (inTg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
  tg.MainButton.onClick(() => isOpen() ? save() : openSheet());
  tg.BackButton.onClick(closeSheet);
  updateMainButton();
} else {
  document.body.classList.add('no-tg');
}
load();
</script>
</body>
</html>
